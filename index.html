<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aktuno Sell - Онлайн магазин одежды и аксесуаров">
    <title>Aktuno Sell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }

        .header-title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            border: 1px solid #444;
            background: #222;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #333;
            border-color: #666;
        }

        .btn-primary {
            background: #b0b0b0;
            border-color: #b0b0b0;
            color: #000;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: #a0a0a0;
            border-color: #a0a0a0;
        }

        .categories-section {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .categories-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }

        .category-btn {
            padding: 10px 12px;
            border: 1px solid #444;
            background: #252525;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            text-align: center;
        }

        .category-btn:hover {
            background: #333;
            border-color: #b0b0b0;
        }

        .category-btn.active {
            background: #b0b0b0;
            border-color: #b0b0b0;
            color: #000;
            font-weight: 500;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #b0b0b0;
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(176, 176, 176, 0.2);
        }

        .product-category {
            background: #b0b0b0;
            color: #000;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            margin: 0;
        }

        .product-image {
            width: 100%;
            height: 240px;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: #444;
            object-fit: cover;
            position: relative;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-counter {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #b0b0b0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-info {
            padding: 16px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .product-description {
            font-size: 13px;
            color: #999;
            margin-bottom: 12px;
            max-height: 60px;
            overflow: hidden;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #b0b0b0;
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #333;
            margin: auto;
        }

        .modal-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: #999;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ccc;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #b0b0b0;
            background: #252525;
        }

        input[type="file"] {
            padding: 8px;
        }

        .photos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .photo-item {
            position: relative;
            width: 100%;
            height: 100px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            overflow: hidden;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-photo-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #cc0000;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            padding: 0;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-photo-btn:hover {
            background: #990000;
        }

        .photo-gallery {
            display: none;
            width: 100%;
        }

        .photo-gallery.active {
            display: block;
        }

        .gallery-main {
            width: 100%;
            height: 300px;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-thumbs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
        }

        .gallery-thumb {
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
        }

        .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-thumb.active {
            border-color: #b0b0b0;
        }

        .cart-panel {
            background: #1a1a1a;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .cart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
            color: #fff;
        }

        .cart-item {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-name {
            font-size: 14px;
            color: #e0e0e0;
        }

        .cart-item-price {
            font-weight: bold;
            color: #b0b0b0;
        }

        .cart-empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .cart-total {
            background: #252525;
            padding: 16px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
        }

        .admin-panel {
            background: #1a1a1a;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .admin-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .admin-tab {
            padding: 8px 16px;
            background: #252525;
            border: none;
            color: #999;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 500;
        }

        .admin-tab.active {
            background: #b0b0b0;
            color: #000;
        }

        .products-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .product-row {
            background: #252525;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-row-image {
            width: 40px;
            height: 40px;
            background: #3a3a3a;
            border-radius: 4px;
            margin-right: 12px;
            object-fit: cover;
        }

        .product-row-name {
            flex: 1;
            font-size: 14px;
        }

        .product-row-category {
            font-size: 12px;
            color: #b0b0b0;
            margin-right: 12px;
        }

        .product-row-price {
            color: #b0b0b0;
            font-weight: bold;
            margin-right: 16px;
        }

        .btn-delete {
            background: #cc0000;
            border-color: #990000;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #990000;
        }

        .categories-list {
            background: #252525;
            border-radius: 6px;
            padding: 16px;
        }

        .category-item {
            background: #3a3a3a;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-item-name {
            font-size: 14px;
            font-weight: 500;
        }

        .login-form {
            text-align: center;
        }

        .password-field {
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .gallery-nav-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .gallery-nav-buttons button {
            flex: 1;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">🛍️ Aktuno Sell</div>
            <div class="header-buttons">
                <button id="cartBtn" class="btn-primary">🛒 Корзина <span id="cartCount">0</span></button>
                <button id="adminBtn" class="btn-primary">👨‍💼 Админ</button>
            </div>
        </header>

        <div class="categories-section">
            <div class="categories-title">Категории</div>
            <div class="categories-grid" id="categoriesGrid"></div>
        </div>

        <div id="mainContent">
            <div class="products-grid" id="productsGrid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <div>Товаров в этой категории не найдено</div>
            </div>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="productModalTitle">Товар</div>
                <button class="close-btn" onclick="closeModal('productModal')">&times;</button>
            </div>
            <div id="productModalContent"></div>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>Корзина</div>
                <button class="close-btn" onclick="closeModal('cartModal')">&times;</button>
            </div>
            <div id="cartContent"></div>
            <button class="btn-primary checkout-btn" onclick="checkout()">📱 Заказать через Telegram</button>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="adminHeader">Вход в админ-панель</div>
                <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
            </div>
            <div id="adminContent"></div>
        </div>
    </div>

    <script>
        const SELLER_ID = 's3r9sr9p';
        const ADMIN_PASSWORD = 'actuno2024';
        
        let DEFAULT_CATEGORIES = [
            'Аксесуары',
            'Сумки',
            'Рюкзаки',
            'Верхняя одежда',
            'Футболки',
            'Штаны',
            'Джинсы',
            'Худи',
            'Кардиганы'
        ];

        let products = [];
        let categories = [];
        let cart = [];
        let isAdminLoggedIn = false;
        let selectedCategory = 'Все товары';
        let selectedPhotosBase64 = [];
        let currentPhotoIndex = 0;

        function initApp() {
            loadCategories();
            loadProducts();
            renderCategories();
            renderProducts();
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('cartBtn').addEventListener('click', openCartModal);
            document.getElementById('adminBtn').addEventListener('click', openAdminModal);
        }

        function loadCategories() {
            const saved = localStorage.getItem('aktuno_categories');
            if (saved) {
                categories = JSON.parse(saved);
            } else {
                categories = [...DEFAULT_CATEGORIES];
                saveCategories();
            }
        }

        function saveCategories() {
            localStorage.setItem('aktuno_categories', JSON.stringify(categories));
        }

        function loadProducts() {
            const saved = localStorage.getItem('aktuno_products');
            if (saved) {
                products = JSON.parse(saved);
            } else {
                products = [
                    {
                        id: 1,
                        name: 'Ремень Fendi Big Buckle Monogramm',
                        price: 11990,
                        description: 'Очень крутой ремень, который носил каждый крутой репер, цвет молочной кости\n\nДлина 106 ширина 4,5\nСостояние 8/10',
                        category: 'Аксесуары',
                        photos: ['👔']
                    },
                    {
                        id: 2,
                        name: 'Сумка Dolce & Gabbana Vintage',
                        price: 12490,
                        description: 'Очень крутая и редкая сумка из нулевых, сохранилась хорошо, имеет красивые змеиные вставки и хорошую вместимость\n\nРазмеры 34х27см\nСостояние 8/10',
                        category: 'Сумки',
                        photos: ['👜']
                    }
                ];
                saveProducts();
            }
            loadCart();
        }

        function saveProducts() {
            localStorage.setItem('aktuno_products', JSON.stringify(products));
        }

        function loadCart() {
            const saved = localStorage.getItem('aktuno_cart');
            cart = saved ? JSON.parse(saved) : [];
            updateCartCount();
        }

        function saveCart() {
            localStorage.setItem('aktuno_cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        function renderCategories() {
            const grid = document.getElementById('categoriesGrid');
            let html = `<button class="category-btn ${selectedCategory === 'Все товары' ? 'active' : ''}" onclick="selectCategory('Все товары')">Все товары</button>`;
            
            categories.forEach(cat => {
                html += `<button class="category-btn ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`;
            });
            
            grid.innerHTML = html;
        }

        function selectCategory(category) {
            selectedCategory = category;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const emptyState = document.getElementById('emptyState');
            
            let filteredProducts = products;
            if (selectedCategory !== 'Все товары') {
                filteredProducts = products.filter(p => p.category === selectedCategory);
            }

            if (filteredProducts.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            grid.innerHTML = filteredProducts.map(product => {
                const firstPhoto = product.photos[0];
                const photoCount = product.photos.length;
                return `
                    <div class="product-card" onclick="viewProductDetails(${product.id})">
                        <div class="product-category">${product.category}</div>
                        <div class="product-image">
                            ${firstPhoto.startsWith('data:') ? `<img src="${firstPhoto}" alt="${product.name}">` : firstPhoto}
                            ${photoCount > 1 ? `<div class="photo-counter">${photoCount} фото</div>` : ''}
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.name}</div>
                            <div class="product-description">${product.description}</div>
                            <div class="product-price">₽${product.price.toLocaleString()}</div>
                            <div class="product-actions">
                                <button onclick="event.stopPropagation(); addToCart(${product.id})" class="btn-primary">Добавить</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewProductDetails(productId) {
            const product = products.find(p => p.id === productId);
            const modal = document.getElementById('productModal');
            const content = document.getElementById('productModalContent');
            document.getElementById('productModalTitle').textContent = product.name;

            let photosHtml = '';
            if (product.photos.length === 0) {
                photosHtml = '<div style="text-align: center; color: #666;">Нет фото</div>';
            } else if (product.photos.length === 1) {
                const photo = product.photos[0];
                photosHtml = `<div style="width: 100%; height: 300px; background: #2a2a2a; border-radius: 6px; overflow: hidden;">
                    ${photo.startsWith('data:') ? `<img src="${photo}" style="width: 100%; height: 100%; object-fit: cover;">` : `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 80px;">${photo}</div>`}
                </div>`;
            } else {
                photosHtml = `
                    <div class="photo-gallery active" id="gallery">
                        <div class="gallery-main">
                            ${product.photos[0].startsWith('data:') ? `<img id="mainPhoto" src="${product.photos[0]}" alt="">` : `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 80px;">${product.photos[0]}</div>`}
                        </div>
                        <div class="gallery-thumbs">
                            ${product.photos.map((photo, idx) => `
                                <div class="gallery-thumb ${idx === 0 ? 'active' : ''}" onclick="switchPhoto(${idx}, '${productId}')">
                                    ${photo.startsWith('data:') ? `<img src="${photo}" alt="">` : `<div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 24px;">${photo}</div>`}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                ${photosHtml}
                <div style="margin-top: 20px;">
                    <div style="font-size: 18px; font-weight: bold; color: #b0b0b0; margin-bottom: 12px;">₽${product.price.toLocaleString()}</div>
                    <div style="font-size: 14px; color: #999; margin-bottom: 16px; white-space: pre-wrap;">${product.description}</div>
                    <button onclick="addToCart(${product.id}); closeModal('productModal')" class="btn-primary" style="width: 100%; padding: 12px;">Добавить в корзину</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function switchPhoto(index, productId) {
            const product = products.find(p => p.id === parseInt(productId));
            const photo = product.photos[index];
            const mainPhoto = document.getElementById('mainPhoto');
            
            if (photo.startsWith('data:')) {
                mainPhoto.src = photo;
            } else {
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = gallery.innerHTML.replace(mainPhoto.outerHTML, 
                    `<div class="gallery-main"><div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 80px;">${photo}</div></div>`);
            }

            document.querySelectorAll('.gallery-thumb').forEach(thumb => thumb.classList.remove('active'));
            event.target.closest('.gallery-thumb').classList.add('active');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity++;
            } else {
                cart.push({
                    id: productId,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });
            }
            saveCart();
            alert('✅ Товар добавлен в корзину!');
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            renderCart();
        }

        function renderCart() {
            const content = document.getElementById('cartContent');
            if (cart.length === 0) {
                content.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
                return;
            }

            let html = '<div class="cart-panel">';
            cart.forEach(item => {
                const total = item.price * item.quantity;
                html += `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-name">${item.name}</div>
                            <div style="font-size: 12px; color: #666; margin-top: 4px;">Кол-во: ${item.quantity}</div>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                            <div class="cart-item-price">₽${total.toLocaleString()}</div>
                            <button onclick="removeFromCart(${item.id})" style="padding: 4px 8px; font-size: 12px;">Удалить</button>
                        </div>
                    </div>
                `;
            });

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            html += `<div class="cart-total"><span>Итого:</span> ₽${total.toLocaleString()}</div></div>`;
            content.innerHTML = html;
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const message = `Привет! Я хочу сделать заказ из магазина Aktuno Sell:\n\n${cart.map(item => `• ${item.name} (${item.quantity}x ₽${item.price})`).join('\n')}\n\nОбщая сумма: ₽${total}\n\nПожалуйста, свяжитесь со мной по поводу доставки и оплаты.`;
            const telegramUrl = `https://t.me/${SELLER_ID}?text=${encodeURIComponent(message)}`;
            window.open(telegramUrl, '_blank');
        }

        function openCartModal() {
            renderCart();
            document.getElementById('cartModal').classList.add('active');
        }

        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.add('active');

            if (isAdminLoggedIn) {
                renderAdminPanel();
            } else {
                renderLoginForm();
            }
        }

        function renderLoginForm() {
            const content = document.getElementById('adminContent');
            content.innerHTML = `
                <div class="login-form">
                    <div class="form-group password-field">
                        <label>Пароль администратора</label>
                        <input type="password" id="adminPassword" placeholder="Введите пароль" style="font-size: 16px;">
                    </div>
                    <button class="btn-primary" onclick="checkPassword()" style="width: 100%; padding: 12px;">Вход</button>
                </div>
            `;
            document.getElementById('adminPassword').focus();
        }

        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                renderAdminPanel();
            } else {
                alert('❌ Неверный пароль');
            }
        }

        function renderAdminPanel() {
            const content = document.getElementById('adminContent');
            const header = document.getElementById('adminHeader');
            header.textContent = 'Админ-панель';

            content.innerHTML = `
                <div class="admin-panel">
                    <div class="admin-tabs">
                        <button class="admin-tab active" onclick="showAdminTab('products')">📦 Товары</button>
                        <button class="admin-tab" onclick="showAdminTab('categories')">🏷️ Категории</button>
                    </div>
                    <div id="adminTabContent"></div>
                    <button onclick="logout()" style="width: 100%; padding: 12px; margin-top: 20px;">Выход</button>
                </div>
            `;
            showAdminTab('products');
        }

        function showAdminTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const content = document.getElementById('adminTabContent');
            
            if (tab === 'products') {
                content.innerHTML = `
                    <div class="admin-title">Управление товарами</div>
                    <div class="products-list" id="productsList"></div>
                    <button class="btn-primary" onclick="showAddProductForm()" style="width: 100%; padding: 12px; margin-bottom: 12px;">+ Добавить товар</button>
                `;
                renderProductsList();
            } else if (tab === 'categories') {
                content.innerHTML = `
                    <div class="admin-title">Управление категориями</div>
                    <div class="categories-list" id="categoriesList"></div>
                    <div class="form-group" style="margin-top: 20px;">
                        <input type="text" id="newCategory" placeholder="Новая категория" style="flex: 1;">
                    </div>
                    <button class="btn-primary" onclick="addCategory()" style="width: 100%; padding: 12px;">+ Добавить категорию</button>
                `;
                renderCategoriesList();
            }
        }

        function renderProductsList() {
            const list = document.getElementById('productsList');
            if (products.length === 0) {
                list.innerHTML = '<div class="cart-empty">Товаров нет</div>';
                return;
            }

            list.innerHTML = products.map(p => {
                const firstPhoto = p.photos[0];
                return `
                    <div class="product-row">
                        <div style="display: flex; align-items: center; flex: 1; gap: 12px;">
                            ${firstPhoto.startsWith('data:') ? `<img src="${firstPhoto}" class="product-row-image">` : `<div class="product-row-image" style="display: flex; align-items: center; justify-content: center; font-size: 20px;">${firstPhoto}</div>`}
                            <div>
                                <div class="product-row-name">${p.name}</div>
                                <div style="font-size: 12px; color: #666; margin-top: 4px;">
                                    <span class="product-row-category">${p.category}</span>
                                    ₽${p.price.toLocaleString()}
                                    ${p.photos.length > 1 ? ` | ${p.photos.length} фото` : ''}
                                </div>
                            </div>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})">Удалить</button>
                    </div>
                `;
            }).join('');
        }

        function renderCategoriesList() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = categories.map(cat => `
                <div class="category-item">
                    <div class="category-item-name">${cat}</div>
                    <button class="btn-delete" onclick="deleteCategory('${cat}')">Удалить</button>
                </div>
            `).join('');
        }

        function addCategory() {
            const input = document.getElementById('newCategory');
            const name = input.value.trim();

            if (!name) {
                alert('Введите название категории!');
                return;
            }

            if (categories.includes(name)) {
                alert('Такая категория уже существует!');
                return;
            }

            categories.push(name);
            saveCategories();
            renderCategories();
            renderCategoriesList();
            input.value = '';
            alert('✅ Категория добавлена!');
        }

        function deleteCategory(catName) {
            if (confirm(`Удалить категорию "${catName}"?`)) {
                categories = categories.filter(c => c !== catName);
                saveCategories();
                renderCategories();
                renderCategoriesList();
                alert('✅ Категория удалена!');
            }
        }

        function showAddProductForm() {
            const content = document.getElementById('adminTabContent');
            selectedPhotosBase64 = [];

            const categoryOptions = categories.map(cat => 
                `<option value="${cat}">${cat}</option>`
            ).join('');

            content.innerHTML = `
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" id="productName" placeholder="Название">
                </div>
                <div class="form-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="productPrice" placeholder="Цена">
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="productCategory">
                        ${categoryOptions}
                    </select>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="productDescription" placeholder="Описание товара"></textarea>
                </div>
                <div class="form-group">
                    <label>Фото товара (можно добавить несколько)</label>
                    <input type="file" id="productPhotos" accept="image/*" multiple onchange="handlePhotosUpload(event)">
                    <div class="photos-container" id="photosPreview"></div>
                </div>
                <button class="btn-primary" onclick="saveNewProduct()" style="width: 100%; padding: 12px; margin-bottom: 8px;">Сохранить</button>
                <button onclick="cancelAddProduct()" style="width: 100%; padding: 12px;">Отмена</button>
            `;
        }

        function handlePhotosUpload(event) {
            const files = Array.from(event.target.files);
            selectedPhotosBase64 = [];
            
            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedPhotosBase64.push(e.target.result);
                    renderPhotosPreview();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderPhotosPreview() {
            const preview = document.getElementById('photosPreview');
            preview.innerHTML = selectedPhotosBase64.map((photo, idx) => `
                <div class="photo-item">
                    <img src="${photo}" alt="Photo">
                    <button class="remove-photo-btn" onclick="removePhoto(${idx})">✕</button>
                </div>
            `).join('');
        }

        function removePhoto(index) {
            selectedPhotosBase64.splice(index, 1);
            renderPhotosPreview();
        }

        function saveNewProduct() {
            const name = document.getElementById('productName').value;
            const price = parseInt(document.getElementById('productPrice').value);
            const category = document.getElementById('productCategory').value;
            const description = document.getElementById('productDescription').value;

            if (!name || !price || !category || !description) {
                alert('Заполните все поля!');
                return;
            }

            if (selectedPhotosBase64.length === 0) {
                alert('Загрузите хотя бы одно фото товара!');
                return;
            }

            const newProduct = {
                id: Date.now(),
                name,
                price,
                category,
                description,
                photos: selectedPhotosBase64
            };

            products.push(newProduct);
            saveProducts();
            renderProducts();
            renderAdminPanel();
            alert('✅ Товар добавлен!');
        }

        function cancelAddProduct() {
            renderAdminPanel();
        }

        function deleteProduct(id) {
            if (confirm('Удалить товар?')) {
                products = products.filter(p => p.id !== id);
                saveProducts();
                renderProducts();
                renderProductsList();
                alert('✅ Товар удален!');
            }
        }

        function logout() {
            isAdminLoggedIn = false;
            closeModal('adminModal');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        window.addEventListener('click', function(event) {
            const productModal = document.getElementById('productModal');
            const cartModal = document.getElementById('cartModal');
            const adminModal = document.getElementById('adminModal');

            if (event.target === productModal) closeModal('productModal');
            if (event.target === cartModal) closeModal('cartModal');
            if (event.target === adminModal) closeModal('adminModal');
        });

        initApp();
    </script>
</body>
</html>
